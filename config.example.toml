# dsc-ircd example config (TOML).
# Full key reference: docs/configuration.md
# Unreal-shaped mapping: docs/REFERENCE.md

[server]
name = "ircd.dsc.local"
motd = "Welcome to dsc-ircd — Unreal-inspired clean-room Rust IRCd"
admin_name = "Mark Hopkins"
admin_email = "ops@example.com"
max_nick_length = 30
max_channel_length = 50
# Optional connection password. Empty (omit the key) means PASS is not required.
# password = "front-door-secret"

# Plaintext lab listen (Unreal: listen { ip *; port 6667; })
[[listen]]
bind = "127.0.0.1:6667"
tls = false

# TLS listen (Unreal: listen { … options { tls; } })
# Generate lab certs: cargo run -p ircd -- gen-cert --out ./certs
[[listen]]
bind = "127.0.0.1:6697"
tls = true
cert = "./certs/cert.pem"
key = "./certs/key.pem"

# IRC-over-WebSocket (browser / Tauri). Text frames carry IRC lines.
[[listen]]
bind = "127.0.0.1:7667"
websocket = true
tls = false

# WSS (TLS + WebSocket)
# [[listen]]
# bind = "127.0.0.1:7668"
# websocket = true
# tls = true
# cert = "./certs/cert.pem"
# key = "./certs/key.pem"

# OPER (lab plaintext password — do not use on a public host).
[oper]
enabled = true
name = "admin"
password = "change-me"

# Channel history (sqlite) — JOIN auto-replay + CHATHISTORY LATEST
[history]
enabled = true
path = "./data/history.sqlite3"
max_per_channel = 1000
auto_replay_on_join = 50

# Built-in SASL PLAIN accounts (lab plaintext — do not reuse on a public host).
[[accounts]]
name = "alice"
password = "alice-pass"

[[accounts]]
name = "bob"
password = "bob-pass"

# Connection / flood safety (lab defaults — tighten for any public listen).
[limits]
max_clients = 256
max_clients_per_ip = 32
flood_lines_per_window = 30
flood_window_secs = 10
# max_line_bytes = 8192
# max_channels = 1024
# max_channels_per_client = 64
# max_members_per_channel = 512
# max_topic_bytes = 390

# Public-host posture. production = true refuses any plaintext listen and
# requires TLS for SASL and OPER. Lab default is false.
# [security]
# production = false
# require_tls_for_auth = true
# registration_timeout_secs = 60
# idle_timeout_secs = 0
# handshake_timeout_secs = 15
# max_handshake_inflight = 64

# Browser WebSocket policy. An empty allowed_origins list denies every
# Origin header. Native clients with no Origin are allowed by default.
# [websocket]
# allowed_origins = ["https://chat.example.com"]
# allow_missing_origin = true
# require_irc_subprotocol = true
