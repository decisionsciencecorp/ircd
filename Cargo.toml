[workspace]
resolver = "2"
members = ["crates/ircd", "crates/ircd-core", "crates/ircc"]
default-members = ["crates/ircd"]
# cargo-fuzz crate lives outside the workspace graph
exclude = ["fuzz"]

[profile.release]
debug = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Decision Science Corp"]
repository = "https://github.com/decisionsciencecorp/ircd"

[workspace.dependencies]
ircd-core = { path = "crates/ircd-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio-tungstenite = "0.26"
futures-util = "0.3"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
